name: CMRE Bi-Weekly Scheduled Research Cycle

on:
  schedule:
    # Se ejecuta los días 1 y 15 de cada mes a las 03:00 UTC (medianoche en Argentina)
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

jobs:
  audit_and_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run Bi-Weekly Research Auditor
        run: |
          python scripts/cron_research_auditor.py

      - name: Run Test Suite Verification
        run: |
          pytest --maxfail=3 -v
