[project]
name = "cmre-engine"
version = "0.3.0"
description = "Competitive ML Reasoning Engine: competition-agnostic knowledge base + reasoning engine for ML competitions across tabular, text, image, time-series and multimodal domains."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "structlog>=24.1",
  "numpy>=2.4.6",
  "torch>=2.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
cmre = "cmre.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
